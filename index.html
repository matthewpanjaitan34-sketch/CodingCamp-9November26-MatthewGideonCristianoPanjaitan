<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Spendly — a modern expense and budget visualizer. Track your spending in IDR with interactive charts.">
  <title>Spendly — Expense &amp; Budget Visualizer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <!-- ===== Header ===== -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path>
            <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path>
            <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path>
          </svg>
        </div>
        <div>
          <h1>Spendly</h1>
          <p class="tagline">Expense &amp; Budget Visualizer</p>
        </div>
      </div>
    </header>

    <main class="container">

      <!-- ===== Dashboard Stats ===== -->
      <section class="stats-grid" aria-label="Spending overview">
        <article class="stat-card">
          <div class="stat-icon stat-icon-emerald">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="1" x2="12" y2="23"></line>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-label">Total Spending</span>
            <span class="stat-value" id="total-spending">Rp 0</span>
          </div>
        </article>

        <article class="stat-card">
          <div class="stat-icon stat-icon-blue">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-label">Total Transactions</span>
            <span class="stat-value" id="total-transactions">0</span>
          </div>
        </article>

        <article class="stat-card">
          <div class="stat-icon stat-icon-amber">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-label">This Month</span>
            <span class="stat-value" id="month-spending">Rp 0</span>
          </div>
        </article>
      </section>

      <!-- ===== Form + Chart ===== -->
      <div class="main-grid">

        <!-- Add Transaction Form -->
        <section class="card form-card">
          <h2 class="card-title">Add Transaction</h2>
          <form id="transaction-form" novalidate>
            <div class="form-group">
              <label for="item-name">Item Name</label>
              <input type="text" id="item-name" name="item-name" placeholder="e.g. Lunch at café" autocomplete="off" required>
            </div>
            <div class="form-group">
              <label for="amount">Amount (IDR)</label>
              <input type="number" id="amount" name="amount" placeholder="e.g. 50000" min="1" step="1" required>
            </div>
            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" name="category" required>
                <option value="" disabled selected>Select a category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Fun">Fun</option>
              </select>
            </div>
            <div class="form-group">
              <label for="date">Date</label>
              <input type="date" id="date" name="date" required>
            </div>
            <button type="submit" class="btn-primary">Add Transaction</button>
          </form>
          <div id="form-feedback" class="form-feedback" role="alert" aria-live="polite"></div>
        </section>

        <!-- Pie Chart -->
        <section class="card chart-card">
          <h2 class="card-title">Spending Distribution</h2>
          <div class="chart-container">
            <canvas id="pie-chart"></canvas>
            <div id="chart-empty" class="chart-empty">
              <span class="empty-icon">📊</span>
              <p>No data to display yet</p>
            </div>
          </div>
        </section>

      </div>

      <!-- ===== Transaction History ===== -->
      <section class="card history-card">
        <h2 class="card-title">Transaction History</h2>
        <div id="transaction-list" class="transaction-list">
          <!-- Populated by JavaScript -->
        </div>
      </section>

    </main>

    <!-- ===== Footer ===== -->
    <footer class="app-footer">
      <p>Spendly &copy; 2026 — Track your expenses with ease</p>
    </footer>

  </div>

  <!-- Chart.js (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Application script -->
  <script src="js/script.js"></script>
</body>
</html>
